name: Release SDKs

env:
  NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
  PYPI_USERNAME: ${{ secrets.PYPI_USERNAME }}
  PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
  MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
  MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
  MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
  MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
  PYTHON_SDK_LOCATION: "python/src"
  JAVA_SDK_LOCATION: "java"
  DOTNET_SDK_LOCATION: "dotnet/StachExtensions/FactSet.Protobuf.Stach.Extensions"

on:
  workflow_dispatch:
    inputs:
      SDKs:
        description: 'Which SDK to release?'
        type: choice
        options:
          - all
          - java
          - python
          - dotnet
        required: true
        default: all

jobs:
  dotnet:
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' 
      && (github.event.inputs.SDKs == 'dotnet' || github.event.inputs.SDKs == 'all'))

    steps:
    - uses: actions/checkout@v2

    - name: Setup Nuget
      uses: nuget/setup-nuget@v1
      with:
        nuget-api-key: ${{ env.NUGET_API_KEY }}
        nuget-version: '5.x'

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 3.1
    
    - name: Build and create the package
      run: dotnet build --configuration Release ${{ env.DOTNET_SDK_LOCATION }}/FactSet.Protobuf.Stach.Extensions.csproj

    - name: Publish the package to Nuget
      run: |
        nuget push ${{ env.DOTNET_SDK_LOCATION }}/bin/Release/*.nupkg -Source https://api.nuget.org/v3/index.json

  python:
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' 
      && (github.event.inputs.SDKs == 'python' || github.event.inputs.SDKs == 'all'))
      
    steps:
    - uses: actions/checkout@v2
      
    - name: Set up Python 3.12.11
      uses: actions/setup-python@v2
      with:
        python-version: 3.12.11
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine
        
    - name: Build and publish to PyPI
      env:
        TWINE_USERNAME: ${{ env.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ env.PYPI_PASSWORD }}
      run: |
        cd ${{ env.PYTHON_SDK_LOCATION }}
        python setup.py sdist bdist_wheel
        twine upload dist/* --verbose
  java:
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' 
      && (github.event.inputs.SDKs == 'java' || github.event.inputs.SDKs == 'all'))
      
    steps:
    - uses: actions/checkout@v3

    - name: Import GPG key
      run: |
        echo "${{ secrets.MAVEN_GPG_PRIVATE_KEY }}" | gpg --batch --import
        echo 'pinentry-mode loopback' >> ~/.gnupg/gpg.conf
        
    - name: Install xmllint
      run: sudo apt-get update && sudo apt-get install -y libxml2-utils

    - name: Extract version from pom.xml
      id: get_version
      run: |
        version=$(xmllint --xpath "/*[local-name()='project']/*[local-name()='version']/text()" ${{ env.JAVA_SDK_LOCATION }}/pom.xml)
        echo "version=$version" >> $GITHUB_OUTPUT
        if [[ "$version" == *SNAPSHOT* ]]; then
          echo "is_snapshot=true" >> $GITHUB_OUTPUT
        else
          echo "is_snapshot=false" >> $GITHUB_OUTPUT
        fi
    - name: Set up JDK for snapshot repository
      if: steps.get_version.outputs.is_snapshot == 'true'
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        server-id: central-portal-snapshots
        server-username: MAVEN_PORTAL_USERNAME
        server-password: MAVEN_CENTRAL_TOKEN
        gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        gpg-passphrase: MAVEN_GPG_PASSPHRASE

    - name: Set up JDK for release repository
      if: steps.get_version.outputs.is_snapshot == 'false'
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        server-id: central
        server-username: MAVEN_PORTAL_USERNAME
        server-password: MAVEN_CENTRAL_TOKEN
        gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        gpg-passphrase: MAVEN_GPG_PASSPHRASE

    - name: Install Maven 3.9.16
      # Maven 3.10 leaves maven-metadata-local.xml and _remote.repositories in the staging repo, which Central rejects
      run: |
        curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz | sudo tar -xz -C /opt
        echo "/opt/apache-maven-3.9.16/bin" >> $GITHUB_PATH

    - name: Print Maven version
      run: mvn -v

    - name: Build with Maven
      run: mvn -B clean package --file ${{ env.JAVA_SDK_LOCATION }}/pom.xml

    - name: Publish to Apache Maven Central
      run: cd ${{ env.JAVA_SDK_LOCATION }} && mvn -B -Psign-artifacts clean verify deploy
      env:
        MAVEN_PORTAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
  